# Production compose smoke test on a hosted runner. No secrets.
name: compose
on:
  push:
    branches: [master, "ai/**"]
  workflow_dispatch:
concurrency:
  group: compose-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: go vet
        run: go vet ./...
      # pkg/assets/assets.go is generated
      - name: gofmt
        run: test -z "$(gofmt -l pkg src | grep -v '^pkg/assets/assets.go$' | tee /dev/stderr)"
      - name: go test
        run: make cover
      - name: coverage summary
        run: |
          { echo '### Go coverage'; echo '```'; tr -s ' \t' ' ' < cover-pkg.txt; tail -1 cover.txt | tr -s ' \t' ' '; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: build compose image
        timeout-minutes: 15
        run: docker compose -f docker-compose.yml --progress plain build
      - name: free port 53
        # systemd-resolved's stub holds 127.0.0.53:53; drop only the stub (stopping resolved cut the runner off)
        run: |
          echo DNSStubListener=no | sudo tee -a /etc/systemd/resolved.conf
          sudo ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
          sudo systemctl restart systemd-resolved
          getent hosts github.com
      - name: smoke
        timeout-minutes: 10
        run: docker/smoke.sh
      - name: down
        if: always()
        run: docker compose -f docker-compose.yml down
