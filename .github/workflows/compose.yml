# Production compose smoke test on a hosted runner. No secrets.
name: compose
on:
  push:
    branches: [master, "ai/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: go test
        run: go test ./...
      - name: build images
        run: docker compose -f docker-compose.yml build && docker compose -f docker-compose.yml pull https-portal
      - name: free port 53
        # systemd-resolved holds 127.0.0.53:53; images are built, so DNS is no longer needed
        run: sudo systemctl stop systemd-resolved
      - name: smoke
        run: docker/smoke.sh
      - name: down
        if: always()
        run: docker compose -f docker-compose.yml down
