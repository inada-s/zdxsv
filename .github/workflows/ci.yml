# Tests, then a smoke test of the server binary on the hosted runner. No secrets.
name: ci
on:
  push:
    branches: [master, "ai/**"]
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: go vet
        run: go vet ./...
      # pkg/assets/assets.go is generated
      - name: gofmt
        run: test -z "$(gofmt -l pkg src | grep -v '^pkg/assets/assets.go$' | tee /dev/stderr)"
      - name: go test
        run: make cover
      - name: coverage summary
        run: |
          { echo '### Go coverage'; echo '```'; tr -s ' \t' ' ' < cover-pkg.txt; tail -1 cover.txt | tr -s ' \t' ' '; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: build and allow port 443
        run: |
          make build
          sudo setcap cap_net_bind_service=+ep bin/zdxsv
      - name: smoke
        timeout-minutes: 5
        # off port 53: the runner may use it for its own DNS
        env:
          ZDXSV_DNS_ADDR: 127.0.0.1:10053
        run: scripts/smoke.sh
      - name: server log
        if: failure()
        run: cat smoke.log
