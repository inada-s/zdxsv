syntax = "proto2";
package proto;

option go_package = "zdxsv/zdxsv/proto";

// Ping/Pong between zproxy, the STUN server and emulators. Battle data is not protobuf.
enum MessageType {
  reserved 1, 4;
  Ping = 2;
  Pong = 3;
}

message PingMessage {
  required int64 timestamp = 1;
  optional string user_id = 2;
}

message PongMessage {
  required int64 timestamp = 1;
  optional string user_id = 2;
  optional string public_addr = 3;
}

message Packet {
  reserved 2, 3, 10, 13;
  required MessageType type = 1;
  optional PingMessage ping_data = 11;
  optional PongMessage pong_data = 12;
}

// Lobby -> emulator, custom notice 0x9951 (zdxsv/lbs_msg_battle.go battleInfoNotice).
message P2PMatching {
  optional string battle_code = 1;
  optional uint32 session_id = 2;  // the battle's GGPO ping test session; 0: no GGPO
  optional int32 peer_id = 4;  // the receiver's index in users
  optional int32 ping_test_duration = 6;  // ms
  repeated P2PUser users = 9;  // every player, in battle order
  repeated PlayerAddress candidates = 10;  // the other players' UDP addresses
  repeated RelayServer relays = 11;  // only when every player has relay_server=1
  optional bool spectator_uplink = 12;
  optional string lobby_session_id = 40;
  optional string battle_server = 41;  // "a.b.c.d:port"
}

message P2PUser {
  optional string user_id = 1;
  optional string user_name = 2;
  optional string pilot_name = 3;
  optional int32 team = 9;  // 1 / 2 (entry side), unset when unknown
  optional int32 ggpo_port = 40;  // 0: none (platform info ggpo)
  optional string sync = 41;  // settings fingerprint, 16 lowercase hex digits (platform info sync)
}

message PlayerAddress {
  optional string user_id = 1;
  optional int32 peer_id = 2;
  optional string ip = 3;  // IPv4 or IPv6, no brackets
  optional int32 port = 4;
}

message RelayServer {
  optional string region = 1;
  optional string ip = 2;
  optional int32 port = 3;
  optional uint64 token = 4;
  optional string ip6 = 5;  // empty: no IPv6
  optional int32 port6 = 40;  // ip6's port
}

// Emulator -> lobby, custom message 0x9952, after the platform info of the first lobby
// connection after a GGPO lobby battle. Logged; round_data also sets the battle records' used_ms.
message P2PMatchingReport {
  optional string battle_code = 1;
  optional int32 player_count = 3;
  optional int32 peer_id = 4;  // the sender's position
  optional string close_reason = 5;  // how GGPO ended (unset: it did not start)
  optional int32 frame_count = 6;
  repeated BattleLogRound round_data = 20;  // per round played: replay BattleLogFile round_data (field 18) entries
  optional int32 input_delay = 21;
  repeated RemotePeerReport remote_peers = 31;  // ping test result per other position
  optional string user_id = 40;
  optional string result = 41;  // "ggpo", "cut" or "server"
  optional string cut_reason = 42;
  optional string sync = 43;  // own fingerprint, when a peer's differs
  optional string sync_differ = 44;  // positions with a differing fingerprint
  optional int32 answered = 45;  // peers that answered the ping test
  optional int32 relay_count = 46;
  optional string ping_error = 47;
  optional int32 ping_wait_ms = 48;
  optional int32 min_delay = 49;
  optional bool fixed_delay = 50;
  optional int32 cut_sends = 51;
  optional int32 rollback_frames = 52;
  optional int32 mismatches = 53;
  optional bool disconnected = 54;
  repeated int32 disconnected_peer_ids = 55 [packed = true];  // positions whose peer disconnected
  optional float rollback_budget = 56;  // frames, learned per PC from the frame slack
  optional float rollback_budget_used = 57;  // frames the input delay left to rollbacks
  optional int32 total_timesync = 58;  // frames slept so a peer could catch up
  optional int32 input_block_count = 59;  // frames that waited for a peer's input (GGPO prediction limit)
  repeated int32 fps_history = 60 [packed = true];  // frames run in each second of the battle
}

message BattleLogRound {
  optional int32 win_team = 1;  // 1 / 2, -1 = a draw
  repeated int32 used_ms = 2 [packed = true];  // by position: the MS id + 1, 0 = unknown
}

message RemotePeerReport {
  optional int32 peer_id = 1;
  optional int32 ping_min_ms = 4;  // GGPO ping during the battle, sampled once a second
  optional int32 ping_median_ms = 5;
  optional int32 ping_max_ms = 6;
  optional string route = 7;  // "direct", "peer <position>" or "relay <index>"
  optional int32 rtt_ms = 40;  // 0: no answer
  optional string addr = 41;  // the address that answered
  optional int32 recv_loss = 42;  // GGPO packets from the peer never received
  optional int32 send_loss = 43;  // GGPO packets to the peer it reported lost
}
