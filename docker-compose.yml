version: '3.7'

# One container runs every server (`zdxsv` with no command = `zdxsv all`): dns, dnas (the
# 443 front end with the login pages), lobby and battle. ZDXSV_LOGIN_ADDR and
# ZDXSV_BATTLE_RPC_ADDR are not listened on in this mode (see docs/DEPLOY.md).
services:
  zdxsv:
    build:
      context: .
      dockerfile: "./docker/zdxsv/Dockerfile"
    restart: always
    ports:
      - "53:53/udp"     # dns
      - "443:443"       # dnas (game consoles), other TLS to ZDXSV_DNAS_HTTPS_BACKEND
      - "8200:8200"     # lobby
      - "8201:8201"     # lobby RPC (zproxy)
      - "8201:8201/udp" # STUN
      - "8202:8202/udp" # STUN test socket (emulator connectivity test)
      - "8203:8203"     # HTTP API (/lbs/status, /lbs/replay, /lbs/live)
      - "8210:8210"     # battle
      - "8210:8210/udp"
    volumes:
      - ./zdxsv.db:/zdxsv.db
    environment:
      - ZDXSV_DNAS_PUBLIC_ADDR=${ZDXSV_DNAS_PUBLIC_ADDR}
      - ZDXSV_DNAS_HTTPS_BACKEND=${ZDXSV_DNAS_HTTPS_BACKEND:-}
      - ZDXSV_LOGIN_PUBLIC_ADDR=${ZDXSV_LOGIN_PUBLIC_ADDR}
      - ZDXSV_LOBBY_ADDR=${ZDXSV_LOBBY_ADDR}
      - ZDXSV_LOBBY_RPC_ADDR=${ZDXSV_LOBBY_RPC_ADDR}
      - ZDXSV_LOBBY_PUBLIC_ADDR=${ZDXSV_LOBBY_PUBLIC_ADDR}
      - ZDXSV_BATTLE_ADDR=${ZDXSV_BATTLE_ADDR}
      - ZDXSV_BATTLE_PUBLIC_ADDR=${ZDXSV_BATTLE_PUBLIC_ADDR}
      - ZDXSV_LOBBY_API_ADDR=${ZDXSV_LOBBY_API_ADDR}
      - ZDXSV_DB_NAME=${ZDXSV_DB_NAME}
